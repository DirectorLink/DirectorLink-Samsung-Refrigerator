name: Publish Release

# A release is published when VERSION (or its release notes) changes on main and
# docs/releases/v<VERSION>.md exists. Without the notes nothing is published, so a
# version can be prepared and tested before it goes out. Releases are never replaced.

on:
  push:
    branches: ["main"]
    paths:
      - "VERSION"
      - "docs/releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be MAJOR.MINOR.PATCH, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if [[ ! -f "docs/releases/$TAG.md" ]]; then
            echo "::notice::No docs/releases/$TAG.md yet - nothing published. Add the release notes to publish $TAG."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists and is never replaced. Bump VERSION to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install tools
        if: steps.gate.outputs.publish == 'true'
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check Lua syntax
        if: steps.gate.outputs.publish == 'true'
        run: luac5.1 -p src/driver.lua

      - name: Check that no secrets or local configuration are committed
        if: steps.gate.outputs.publish == 'true'
        run: python scripts/check_repo.py

      - name: Run driver tests
        if: steps.gate.outputs.publish == 'true'
        run: python tests/test_driver.py

      - name: Build and check the package
        if: steps.gate.outputs.publish == 'true'
        run: python scripts/build.py

      - name: Create checksums
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: (cd dist && sha256sum DirectorLink-Samsung-Refrigerator.c4z) > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "dist/DirectorLink-Samsung-Refrigerator.c4z" \
            "SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Samsung Refrigerator (DirectorLink) $TAG" \
            --notes-file "docs/releases/$TAG.md"
